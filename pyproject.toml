[project]
name = "tradebot"
version = "0.1.0"
description = "Human-in-the-loop trading system for Delta Exchange (crypto) and NSE (Angel One)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "duckdb>=1.5.6",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyotp>=2.10.0",
    "pyyaml>=6.0",
    "tabulate>=0.10.0",
]

[project.scripts]
tradebot = "tradebot.__main__:main"

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/tradebot/strategies/crypto.py" = ["RUF012"]  # ClassVar declared on Strategy base
